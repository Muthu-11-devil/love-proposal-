<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Love Proposal ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- Background Music -->

<audio id="bgMusic" loop preload="auto">
    <source src="love-music.mp3" type="audio/mpeg">
</audio>


<!-- Music Button -->

<button id="musicButton"
        class="music-button"
        onclick="toggleMusic()">

    🎵 Play Music

</button>


<!-- Floating Hearts -->

<div id="hearts"></div>


<div class="container">


    <h1>💕 Love Proposal 💕</h1>

    <div class="big-heart">
        ❤️
    </div>


    <!-- Main Form -->

    <div class="card">


        <label>Your Name</label>

        <input
            type="text"
            id="yourName"
            placeholder="Enter your name"
        >


        <label>Crush's Name</label>

        <input
            type="text"
            id="crushName"
            placeholder="Enter their name"
        >


        <label>
            How many years have you loved them?
        </label>

        <input
            type="number"
            id="years"
            placeholder="Example: 3"
            min="0"
            step="0.1"
        >


        <label>
            Is it your first love?
        </label>

        <select id="firstLove">

            <option>Yes</option>
            <option>No</option>

        </select>


        <!-- Special Photo -->

        <label>
            📸 Add a Special Photo
        </label>

        <input
            type="file"
            id="specialPhoto"
            accept="image/*"
        >


        <!-- Personal Message -->

        <label>
            💌 Personal Love Message
        </label>

        <textarea
            id="customMessage"
            placeholder="Write something special..."
        ></textarea>


        <!-- Special Date -->

        <label>
            📅 Special Date
        </label>

        <input
            type="date"
            id="specialDate"
        >


        <button onclick="generateProposal()">

            Generate Proposal ❤️

        </button>


    </div>


    <!-- Love Score -->

    <div
        id="scoreSection"
        class="hidden"
    >

        <h2>💖 Love Score</h2>

        <div class="score-bar">

            <div id="scoreFill">
                0%
            </div>

        </div>

        <p id="scoreMessage"></p>

    </div>



    <!-- Envelope -->

    <div
        id="envelopeSection"
        class="hidden"
    >

        <h2>
            A Letter Awaits You 💌
        </h2>


        <div
            id="envelope"
            onclick="openLetter()"
        >

            💌

        </div>


        <p>
            Tap the envelope
        </p>

    </div>


    <!-- Letter -->

    <div
        id="letterSection"
        class="hidden"
    >


        <div class="letter">


            <!-- Rose -->

            <div id="roseContainer">

                <div class="rose">
                    🌹
                </div>

                <p>
                    A special rose for you ❤️
                </p>

            </div>


            <!-- Photo -->

            <div
                id="photoContainer"
                class="hidden"
            >

                <img
                    id="proposalPhoto"
                    alt="Special Memory"
                >

            </div>


            <!-- Special Date -->

            <div
                id="dateContainer"
                class="hidden"
            >

                <p id="proposalDate"></p>

            </div>


            <!-- Personal Message -->

            <div
                id="customMessageDisplay"
                class="hidden"
            ></div>


            <!-- Proposal -->

            <p id="proposalText"></p>


        </div>




        <!-- Download -->

        <button onclick="downloadTxt()">
            📥 Download Proposal
        </button>


        <!-- Share -->

        <button onclick="shareProposal()">
            📱 Share Proposal
        </button>


        <!-- Feedback -->

        <div class="feedback">

            <h2>
                💬 Your Feedback
            </h2>


            <textarea
                id="feedbackText"
                placeholder="Tell us what you think..."
            ></textarea>


            <button onclick="submitFeedback()">

                Submit Feedback ❤️

            </button>


            <p id="feedbackMessage"></p>

        </div>


        <!-- Another -->

        <button onclick="location.reload()">

            Generate Another

        </button>


    </div>




<!-- UNIQUE FEATURES -->



    <div class="story-box">

        <h2>🔮 Create Your Love Story</h2>

        <input
            type="text"
            id="meetPlace"
            placeholder="Where did you meet?"
        >

        <input
            type="text"
            id="favoriteMemory"
            placeholder="Your favorite memory"
        >

        <input
            type="text"
            id="dreamPlace"
            placeholder="Your dream destination"
        >

        <button onclick="generateLoveStory()">
            Create My Story ✨
        </button>

        <div
            id="loveStory"
            class="hidden"
        ></div>

    </div>


    <div class="star-section">

        <h2>🌌 Your Love Sky</h2>

        <p>Tap a star to discover a secret message ✨</p>

        <div id="starSky">

            <span onclick="starMessage(1)">⭐</span>
            <span onclick="starMessage(2)">✨</span>
            <span onclick="starMessage(3)">⭐</span>
            <span onclick="starMessage(4)">🌟</span>
            <span onclick="starMessage(5)">✨</span>
            <span onclick="starMessage(6)">⭐</span>

            <div id="starMessage">
                Tap a star 💫
            </div>

        </div>

    </div>

</div>
</div>

<script src="script.js"></script>

</body>

</html>
